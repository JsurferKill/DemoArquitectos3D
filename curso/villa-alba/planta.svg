<text x="345.0" y="100" font-size="2.6" font-weight="bold" fill="#000" stroke="none">Notas</text>
<text x="345.0" y="104.5" font-size="2.1" fill="#000" stroke="none">1. Salón-comedor y cocina forman un único espacio</text>
<text x="348.5" y="108.1" font-size="2.1" fill="#000" stroke="none">en el modelo; la línea discontinua en x = 5,00</text>
<text x="348.5" y="111.69999999999999" font-size="2.1" fill="#000" stroke="none">los separa solo para rotular (cocina al este).</text>
<text x="345.0" y="116.49999999999999" font-size="2.1" fill="#000" stroke="none">2. El recibidor es una sala cerrada; se abre al salón</text>
<text x="348.5" y="120.09999999999998" font-size="2.1" fill="#000" stroke="none">por un paso sin hoja de 2,30 m (x = -7,50 a -5,20)</text>
<text x="348.5" y="123.69999999999997" font-size="2.1" fill="#000" stroke="none">en el muro del eje z = -1. El baño 2 lo cierran</text>
<text x="348.5" y="127.29999999999997" font-size="2.1" fill="#000" stroke="none">tabiques oscuros; su puerta da al salón.</text>
<text x="345.0" y="132.09999999999997" font-size="2.1" fill="#000" stroke="none">3. Superficies netas medidas a caras interiores</text>
<text x="348.5" y="135.69999999999996" font-size="2.1" fill="#000" stroke="none">de muros (e = 0,20 m, centrados en los ejes).</text>
<text x="348.5" y="139.29999999999995" font-size="2.1" fill="#000" stroke="none">Recinto del baño 2 descontado del salón.</text>
<text x="345.0" y="144.09999999999994" font-size="2.1" fill="#000" stroke="none">4. La ventana alta de fachada norte (antepecho</text>
<text x="348.5" y="147.69999999999993" font-size="2.1" fill="#000" stroke="none">2,25 m, h = 0,50 m) queda por encima del plano</text>
<text x="348.5" y="151.29999999999993" font-size="2.1" fill="#000" stroke="none">de corte y se grafía como ventana por</text>
<text x="348.5" y="154.89999999999992" font-size="2.1" fill="#000" stroke="none">homogeneidad con el resto.</text>
<text x="345.0" y="159.6999999999999" font-size="2.1" fill="#000" stroke="none">5. Hoja pivotante de entrada dibujada abierta 90°</text>
<text x="348.5" y="163.2999999999999" font-size="2.1" fill="#000" stroke="none">hacia el interior (hueco 1,60 m).</text>
<text x="345.0" y="168.09999999999988" font-size="2.1" fill="#000" stroke="none">6. Ejes: x crece al este, z al sur; origen en el</text>
<text x="348.5" y="171.69999999999987" font-size="2.1" fill="#000" stroke="none">centro de la parcela. Cotas en metros.</text>
